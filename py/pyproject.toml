[build-system]
requires = ["setuptools>=68", "wheel", "Cython>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "unidav"
version = "0.1.0"
description = "Python binding for the UniDAV C ABI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "lbartoletti" }]
keywords = ["caldav", "carddav", "vcard", "icalendar", "pim"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/lituus-lab/UniDAV"
Repository = "https://github.com/lituus-lab/UniDAV"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["unidav"]
